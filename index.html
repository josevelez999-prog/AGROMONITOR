<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#27ae60" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GreenLog" />
    <title>GreenLog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registrar Service Worker para soporte offline
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(reg => {
              console.log("✓ SW registrado", reg.scope);
              // Auto-actualizar si hay nueva versión
              reg.addEventListener("updatefound", () => {
                const sw = reg.installing;
                sw?.addEventListener("statechange", () => {
                  if (sw.state === "installed" && navigator.serviceWorker.controller) {
                    console.log("Nueva versión disponible, recargar");
                  }
                });
              });
            })
            .catch(err => console.warn("SW falló:", err));
        });
      }
    </script>
  </body>
</html>
