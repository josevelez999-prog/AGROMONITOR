<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#27ae60" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GreenLog" />
    <title>GreenLog</title>
    <style>
      /* Permitir rotación libre del dispositivo */
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        -webkit-text-size-adjust: 100%;
      }
      /* Optimización para landscape */
      @media screen and (orientation: landscape) and (max-width: 1024px) {
        body {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registrar Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(reg => {
              console.log("✓ SW registrado", reg.scope);
              reg.update();
              reg.addEventListener("updatefound", () => {
                const sw = reg.installing;
                sw?.addEventListener("statechange", () => {
                  if (sw.state === "installed" && navigator.serviceWorker.controller) {
                    console.log("Nueva versión SW disponible, recargando...");
                    window.location.reload();
                  }
                });
              });
            })
            .catch(err => console.warn("SW falló:", err));

          navigator.serviceWorker.addEventListener("message", e => {
            if (e.data?.type === "SW_UPDATED") {
              console.log("SW actualizado, recargando...");
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
